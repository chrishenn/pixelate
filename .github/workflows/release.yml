name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - run: mise run build

#      - name: Set up Go
#        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
#        with:
#          go-version: 1.24.x
#          cache: false
#      - name: Install dependencies
#        run: go get .
#      - name: Build
#        run: go build -o pixelate .
#      - name: Test
#        run: go test -v ./...

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixelate
          path: pixelate
          overwrite: true

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pixelate
          path: pkg
      - name: GitHub Release
        run: |
          gh release delete "${GITHUB_REF_NAME}" --repo ${{ github.repository }} || true
          gh release create "${GITHUB_REF_NAME}" pkg/* --repo ${{ github.repository }} --title "${GITHUB_REF_NAME}" --notes "Automated release of ${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
