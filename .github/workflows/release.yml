name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: true
      - name: Build
        run: mise run build
      - name: Test
        run: mise run test
      - name: GitHub Release
        run: |
          gh release delete "$GREF" --repo "$GREPO" -y || true
          gh release create "$GREF" pixelate --repo "$GREPO" --title "$GREF" --notes "Automated release of $GREF"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          MISE_GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GREPO: ${{github.repository}}
          GREF: ${{github.ref_name}}
