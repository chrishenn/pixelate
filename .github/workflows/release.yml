name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.x
          cache: false
      - name: Install dependencies
        run: go get .
      - name: Build
        run: go build -o pixelate .
      - name: Test
        run: go test -v ./...
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixelate
          path: pixelate
          overwrite: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pixelate
          path: pkg
      - name: GitHub Release
        run: |
          gh release delete "${GITHUB_REF_NAME}" --repo ${{ github.repository }} || true
          gh release create "${GITHUB_REF_NAME}" pkg/* --repo ${{ github.repository }} --title "${GITHUB_REF_NAME}" --notes "Automated release of ${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
