[tools]
actionlint = "latest"
"aqua:securego/gosec" = "latest"
go = "1.26"
"go:golang.org/x/lint/golint" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
gofumpt = "latest"
golangci-lint = "latest"
hk = "latest"
just = "latest"
pinact = "latest"
pkl = "latest"
zizmor = "latest"

[env]
REPO = "{{ config_root | absolute }}"
go_set_goroot = "1"

[tasks.fix]
alias = "f"
run = "hk fix --all"

[tasks.check]
alias = "c"
run = "hk check --all"

[tasks.release]
description = "force-tag and push a version release"
alias = "rel"
run = '''
ver="$(cat ./version)"
git add -A
git commit -am "Automated release of: v$ver"
git push
git tag -a "v$ver" -m "Automated release of: v$ver" -f
git push --tags -f
'''

[tasks.sync]
alias = 's'
usage = 'arg "<msg>" default="sync"'
run = 'git add -A && git commit -am "{{usage.msg}}" && git pull && git push'

[tasks.build]
run = 'go build ./cmd/pixelate'

[tasks.test]
run = 'go test -count=1 -v ./cmd/...'

[tasks.bench]
run = 'go test -bench BenchmarkPixelate -run ^$ -count 1'
